<section>
<h2>اليوم 1: من الصورة إلى الحقل</h2>
<ol>
<li><p>جهة بيئية تريد أن تعرف صباح الغد هل فاض سد ترابي صغير بعد عاصفة بدأت الليلة وستبقى غيومها يومين. ما المصدر الأول؟</p><ul><li><b>أ.</b> صورة بصرية بدقة 10 أمتار، لأنها الأوضح في رؤية حدود الماء</li><li><b>ب.</b> صورة رادارية للسد، لأنها ترى الماء المكشوف عبر الغيوم ليلًا</li><li><b>ج.</b> بيانات إعادة التحليل للمطر الذي سقط على الإقليم في الليلة نفسها</li><li><b>د.</b> صورة حرارية، لأن سطح الماء أبرد من الأرض المحيطة به</li></ul></li>
<li><p>مزارع يملك بستان نخيل مربعًا تقريبًا مساحته نصف هكتار. تريد الهيئة أن تتابع خضرته شهريًّا من الصور. أي دقة تعطي عشرة بكسلات نقية على الأقل؟</p><ul><li><b>أ.</b> 30 مترًا، لأن سلسلتها أطول وتكفي لمتابعة شهرية</li><li><b>ب.</b> 250 مترًا، لأنها يومية والزيارة أهم من الدقة</li><li><b>ج.</b> 10 أمتار، فهي تبقي بعد الحافة بكسلات نقية كافية</li><li><b>د.</b> لا شيء من الصور العامة، فلا بد من صور تجارية أدق</li></ul></li>
<li><p>بستان في واحة: متوسط الانعكاس الأحمر 0.08، وتحت الأحمر القريب 0.32، في موعد صافٍ. كم مؤشر الغطاء النباتي؟ (رقمان بعد الفاصلة)</p></li>
<li><p>حقل صرّح صاحبه بعلف صيفي. أرقام سلسلته: قمة الشتاء 0.81، ومتوسط الصيف 0.15، وقمة الصيف 0.22. بقواعد الهيئة، ما الخطوة التالية؟</p><ul><li><b>أ.</b> إنذار للمزارع بأن تصريحه غير صحيح</li><li><b>ب.</b> لا شيء، فالحقل مزروع والمزارع صرّح بزراعة</li><li><b>ج.</b> انتظار صور الموسم القادم قبل أي إجراء</li><li><b>د.</b> طلب تحقق: النمط شتوي والتصريح صيفي</li></ul></li>
<li><p>أي جملة تصلح في خطاب تحقق إلى مزارع صغير نبّهت الصور إلى قطعته؟</p><ul><li><b>أ.</b> «نرجو تحديد موعد لزيارة الحقل، والزيارة للتحقق ولا تعني مخالفة.»</li><li><b>ب.</b> «تبيّن لنا أن قطعتكم مخالفة، ويُرجى تصحيح الوضع خلال أسبوع وإلا طُبّقت الغرامة.»</li><li><b>ج.</b> «أظهر نظام الذكاء الاصطناعي في الهيئة أن تصريحكم غير صحيح بدرجة عالية من الثقة.»</li><li><b>د.</b> «عليكم إثبات صحة تصريحكم بالمستندات قبل نهاية الموسم.»</li></ul></li>
<li><p>في مصفوفة الساحل على الشريحة السابقة، الخريطة تقول «سبخة» في 30 نقطة. ماذا تقول هذه الأرقام؟</p><ul><li><b>أ.</b> 60% من سبخات الخريطة سبخة فعلًا، أي 9 من 15</li><li><b>ب.</b> 30% من سبخات الخريطة سبخة فعلًا، والباقي غيرها</li><li><b>ج.</b> دقة الخريطة 66% لأن القطر 53 من 80 نقطة</li><li><b>د.</b> أكثر ما تخلط به الخريطة السبخة هو الماء المكشوف</li></ul></li>
<li><p>في مصفوفة الساحل، عمود «جرداء» على الأرض فيه: 0 في صف الماء، و15 في صف السبخة، و26 في صف جرداء. كم دقة المنتج لفئة جرداء؟ (رقمان بعد الفاصلة)</p></li>
<li><p>جهة بيئية قاست دقة المستخدم لفئة «مانجروف» في خريطة: 0.85 من 20 نقطة. الاستخدام المقترح يحتاج 0.80 على الأقل. ما الحكم؟</p><ul><li><b>أ.</b> مسموح، لأن 0.85 أكبر من 0.80</li><li><b>ب.</b> غير مسموح، لأن الدقة الحقيقية أقل من 0.80</li><li><b>ج.</b> لا نعرف بعد: نجمع نقاطًا أكثر</li><li><b>د.</b> نستعمل الدقة الكلية للخريطة بدلًا منها</li></ul></li>
<li><p>جهة بيئية تريد أن تعرف هل انحسرت بحيرة موسمية خلال عشرين سنة. ما المصدر الأول؟</p><ul><li><b>أ.</b> صور رادارية لآخر شهر، لأنها ترى الماء عبر الغيوم</li><li><b>ب.</b> مجس منسوب ماء في البحيرة يقرأ كل ساعة</li><li><b>ج.</b> سلسلة صور بصرية طويلة للسنوات العشرين</li><li><b>د.</b> تنبؤ موسمي للمطر في السنة القادمة</li></ul></li>
<li><p>صح أم خطأ: خلية إعادة التحليل في ERA5 تصف المطر الذي سقط على مزرعة بعينها في يوم عاصفة رعدية محلية.</p><ul><li><b>أ.</b> صح</li><li><b>ب.</b> خطأ</li></ul></li>
<li><p>حقل مربع مساحته 4 هكتارات. كم بكسلًا نقيًّا تقريبًا بدقة 30 مترًا بعد استبعاد صف على كل حافة؟</p><ul><li><b>أ.</b> نحو 44، فالقسمة على 900 متر مربع تكفي</li><li><b>ب.</b> نحو 16، بعد استبعاد صف على كل حافة</li><li><b>ج.</b> لا شيء، فالدقة 30 مترًا أخشن من الحقل</li><li><b>د.</b> نحو 400، كما في دقة 10 أمتار</li></ul></li>
<li><p>مشهد Sentinel-2 غيمه الكلي 8%. تريد أن تستعمله لحقول في زاوية واحدة من المشهد. ما الذي تفعله؟</p><ul><li><b>أ.</b> تحسب الصفاء فوق حقولك أنت من طبقة SCL المرافقة</li><li><b>ب.</b> تستعمله، فرقم 8% يعني أن المشهد صافٍ تقريبًا</li><li><b>ج.</b> تستبعده، لأن أي غيم في المشهد يفسد كل البكسلات</li><li><b>د.</b> تنتظر مشهدًا بغيم صفر فوق المربع كله</li></ul></li>
<li><p>حقل في واحة: الانعكاس الأحمر 0.10 وتحت الأحمر القريب 0.40 في موعد صافٍ. كم مؤشر الغطاء النباتي؟</p><ul><li><b>أ.</b> 0.75</li><li><b>ب.</b> 0.3</li><li><b>ج.</b> 0.6</li><li><b>د.</b> 0.25</li></ul></li>
<li><p>سلسلة حقل برسيم: 0.82 ثم 0.21 ثم 0.80 في ثلاثة مواعيد متتالية بينها خمسة أيام. ما التفسير الأقرب؟</p><ul><li><b>أ.</b> حُشّ البرسيم ثم نما في خمسة أيام</li><li><b>ب.</b> المزارع حرث الحقل وزرعه من جديد</li><li><b>ج.</b> المحصول تعرض لإجهاد مائي حاد ثم تعافى</li><li><b>د.</b> موعد غير صافٍ فوق الحقل: غيم أو ظل</li></ul></li>
<li><p>قطعة صُرّح بأنها بور، وسلسلتها خضراء من ديسمبر إلى أبريل بقمة 0.85. بقواعد الهيئة، ما الخطوة التالية؟</p><ul><li><b>أ.</b> غرامة على تصريح خاطئ</li><li><b>ب.</b> تعديل التصريح في السجل إلى قمح</li><li><b>ج.</b> لا شيء، فالزراعة لا تضر أحدًا</li><li><b>د.</b> طلب تحقق ميداني يصف ما رأيناه</li></ul></li>
<li><p>صح أم خطأ: سلسلة مؤشر الغطاء النباتي تكفي لتمييز القمح من الشعير في حقل.</p><ul><li><b>أ.</b> صح</li><li><b>ب.</b> خطأ</li></ul></li>
<li><p>قاعدة تنبيه تعطي النسبة نفسها من التنبيهات في القطع الكبيرة والصغيرة. لماذا قد تبقى غير منصفة؟</p><ul><li><b>أ.</b> لأن النسبة المتساوية تكفي لإثبات الإنصاف</li><li><b>ب.</b> لأن القطع الصغيرة تستهلك ماءً أقل فلا تستحق المتابعة</li><li><b>ج.</b> لأن نسبة التنبيه الكاذب قد تكون أعلى في الصغيرة</li><li><b>د.</b> لأن صور القطع الصغيرة أحدث من صور الكبيرة</li></ul></li>
<li><p>مصفوفة التباس: صف «نخيل» في الخريطة فيه 40 نقطة، منها 28 نخيل في المرجع و12 أرض جرداء. كم دقة المستخدم لفئة النخيل؟</p><ul><li><b>أ.</b> 0.30</li><li><b>ب.</b> 0.70</li><li><b>ج.</b> 0.43</li><li><b>د.</b> لا تُحسب دون عمود النخيل</li></ul></li>
<li><p>برنامج دعم يرسل منحة إلى كل مزرعة نخيل تظهر في خريطة. أي رقم يقول كم مزرعة نخيل لن تصلها المنحة؟</p><ul><li><b>أ.</b> دقة المستخدم لفئة النخيل</li><li><b>ب.</b> الدقة الكلية للخريطة</li><li><b>ج.</b> نصف عرض فترة الثقة</li><li><b>د.</b> دقة المنتج لفئة النخيل</li></ul></li>
<li><p>صح أم خطأ: خريطة دقتها الكلية 90% في إقليم صحراوي قد تكون ضعيفة في فئة الحقول المزروعة.</p><ul><li><b>أ.</b> صح</li><li><b>ب.</b> خطأ</li></ul></li>
<li><p>دقة المستخدم لفئة «مانجروف» 0.90 من 25 نقطة، والاستخدام يحتاج 0.85. ما الحكم؟</p><ul><li><b>أ.</b> مسموح، لأن 0.90 أكبر من 0.85</li><li><b>ب.</b> غير مسموح، لأن العينة صغيرة</li><li><b>ج.</b> لا نعرف بعد: الحد داخل الفترة</li><li><b>د.</b> نستعمل دقة المنتج بدلًا منها</li></ul></li>
<li><p>فريق يجمع النقاط المرجعية بفتح الخريطة ثم زيارة نقاطها. ما المشكلة الأهم؟</p><ul><li><b>أ.</b> يرى المسجّل الخريطة قبل التسجيل</li><li><b>ب.</b> الزيارات الميدانية أغلى من الصور</li><li><b>ج.</b> النقاط قليلة في الفئات الكبيرة</li><li><b>د.</b> الزيارات لا تصلح مرجعًا لخريطة من الأقمار</li></ul></li>
</ol>
</section>
<section>
<h2>اليوم 2: الماء: التنبؤ والري والتسرب، ثم الخريطة</h2>
<ol>
<li><p>مورد يعرض خريطة نخيل لواحة، ويقول إن دقتها الكلية 92%. تريد الهيئة أن ترسل بها تنبيه سوسة النخيل إلى كل صاحب نخيل. ما أول ما تطلبه؟</p><ul><li><b>أ.</b> دقة كلية من سنة أحدث، لأن الواحات تتغير كل سنة</li><li><b>ب.</b> لا شيء، فإرسال أي تنبيه من خريطة قرار فردي مرفوض</li><li><b>ج.</b> دقة المستخدم لفئة النخيل، لأنها تخص من يقرأ الخريطة</li><li><b>د.</b> دقة المنتج للنخيل في الواحة، لأنها تقول من تفوّته</li></ul></li>
<li><p>تنبؤ سرعة الريح لمطار: متوسط خطئه المطلق 2.4 كم/ساعة، ومتوسط خطأ المناخ المعتاد 3.0 كم/ساعة. كم المهارة؟ (رقمان بعد الفاصلة)</p></li>
<li><p>حقل نخيل: الاستنزاف الليلة 20 ملم، وTAW 100 ملم، وRAW 50 ملم. غدًا: ET0 = 10 ملم، وKc = 0.9، ولا مطر ولا ري. كم الاستنزاف مساء الغد بالملم؟</p></li>
<li><p>مزرعة نخيل: RAW = 50 ملم، وKc = 0.9. هذا الصباح الاستنزاف 25 ملم، وتنبؤ ET0 للأيام الثلاثة القادمة 30 ملم. ماذا تقول القاعدة؟</p><ul><li><b>أ.</b> اروِ اليوم، لأن المجموع مع الاستهلاك القادم يبلغ RAW</li><li><b>ب.</b> لا تروِ، لأن الاستنزاف الآن نصف الماء الميسّر فقط</li><li><b>ج.</b> لا تروِ، لأن 0.9 × (25 زائد 30) = 49.5، وهو أقل من 50</li><li><b>د.</b> انتظر حتى يبلغ الاستنزاف 50 ملم ثم اروِ في اليوم نفسه</li></ul></li>
<li><p>جربت هيئة قاعدة ري جديدة على مزرعة نخيل واحدة موسمًا واحدًا، ووجدت توفيرًا بين 6 و12 من كل 100 م³ بحسب التربة. أي جملة تصلح لرسالة إلى مزارعي الواحة؟</p><ul><li><b>أ.</b> «ستوفر القاعدة الجديدة 9% من ماء مزرعتك هذا الموسم.»</li><li><b>ب.</b> «تشير محاكاة ميزان الماء إلى توفير 6% إلى 12% بحسب TAW ومهارة التنبؤ.»</li><li><b>ج.</b> «قد توفر بين 6 و12 من كل 100 م³ بحسب تربتك، بعد تجربة موسم واحد.»</li><li><b>د.</b> «ثبت أن القاعدة توفر الماء في الواحة دون أي ضرر على النخيل.»</li></ul></li>
<li><p>حي في مدينة: وسيط التدفق الليلي الأدنى في أول أسبوعين 10 م³/ساعة. الحد = خط الأساس زائد الأكبر من 2 و0.3 × خط الأساس. كم الحد بالمتر المكعب في الساعة؟</p></li>
<li><p>نظام إنذار لأعطال مضخات الآبار أصدر 120 إنذارًا في سنة. وجد الفريق عطلًا حقيقيًّا عند 30 منها، وكان في السنة 40 عطلًا. كم الدقة؟ (رقمان بعد الفاصلة)</p></li>
<li><p>شركة ناشئة تطلب من جهة مياه في مدينة قراءات عدادات البيوت ساعة بساعة مع العناوين، لتبني تطبيقًا لترشيد الاستهلاك. ما أول ما يلزم قبل المشاركة؟</p><ul><li><b>أ.</b> نشر القراءات برخصة CC BY 4.0 حتى تستعملها الشركة وغيرها بالشروط نفسها</li><li><b>ب.</b> غرض مكتوب وأساس نظامي، واتفاقية مشاركة تحدد من يصل إلى القراءات</li><li><b>ج.</b> حذف أسماء المشتركين من الملف، فتصبح القراءات بيانات غير شخصية</li><li><b>د.</b> لا شيء، لأن الغرض ترشيد المياه وهو في مصلحة المشتركين أنفسهم</li></ul></li>
<li><p>حالة في جهة بلدية: كاميرات ذكية تصدر مخالفات آلية لمن يسقي حديقته في ساعات الذروة. الماء 3، والجاهزية 3، والإنصاف 1، والمساءلة 0. أين تضعها في الخريطة؟</p><ul><li><b>أ.</b> في المرتبة التي يعطيها مجموعها 7 من 12 بين الحالات</li><li><b>ب.</b> في أعلى الترتيب، لأن درجتي الماء والجاهزية كاملتان</li><li><b>ج.</b> ترفض نهائيًّا، ولا تعود إلى الخريطة أبدًا</li><li><b>د.</b> تُعلَّق حتى يُعاد تصميمها بخطوة بشرية وحق اعتراض</li></ul></li>
<li><p>عداد عند مدخل منطقة إمداد يقرأ كل ساعة. ما الذي يستطيع أن يقوله وحده؟</p><ul><li><b>أ.</b> في أي شارع من المنطقة يقع التسرب</li><li><b>ب.</b> كم ماءً دخل المنطقة في كل ساعة بالضبط</li><li><b>ج.</b> أي بيت يستهلك أكثر من المعتاد ليلًا</li><li><b>د.</b> كم من الماء فُقد بسبب عدادات البيوت</li></ul></li>
<li><p>تنبؤ بالحرارة الصغرى لمزارع العنب: متوسط خطئه المطلق 1.5 درجة، وخطأ المناخ المعتاد 1.5 درجة. ما مهارته؟</p><ul><li><b>أ.</b> 0.5</li><li><b>ب.</b> 1</li><li><b>ج.</b> صفر</li><li><b>د.</b> لا تُحسب دون الانحياز</li></ul></li>
<li><p>TAW 80 ملم وRAW 40 ملم. الاستنزاف صباح اليوم 60 ملم. كم معامل الإجهاد Ks؟</p><ul><li><b>أ.</b> 0.5</li><li><b>ب.</b> 0.75</li><li><b>ج.</b> 1</li><li><b>د.</b> 0.25</li></ul></li>
<li><p>مورد يقول إن جدوله بالتنبؤ وفّر 25% في محاكاة. ما أول سؤال تطرحه؟</p><ul><li><b>أ.</b> على أي طقس شُغّلت المحاكاة: الفعلي أم المتنبأ؟</li><li><b>ب.</b> كم يكلف الاشتراك في الخدمة كل سنة لمزرعة متوسطة</li><li><b>ج.</b> أي نموذج تعلم آلي يستعمل في التنبؤ اليومي</li><li><b>د.</b> هل جُرّب الجدول في دولة أخرى قبل الإقليم</li></ul></li>
<li><p>صح أم خطأ: إذا وفّرت قاعدة الري الماء نفسه بالتنبؤ وبالمناخ المعتاد، فالتوفير يأتي من القاعدة لا من مهارة التنبؤ.</p><ul><li><b>أ.</b> صح</li><li><b>ب.</b> خطأ</li></ul></li>
<li><p>أي سطر يصلح «لما لا نعرفه» في رسالة لمزارعي واحة عن قاعدة ري جديدة؟</p><ul><li><b>أ.</b> «التوفير مضمون في كل أنواع الترب وفي كل المواسم.»</li><li><b>ب.</b> «مهارة التنبؤ 0.27 أمام المناخ المعتاد في الإقليم.»</li><li><b>ج.</b> «سنعرف أكثر بعد أن ننتهي من تحليل كل البيانات.»</li><li><b>د.</b> «جربناها موسمًا واحدًا فقط، في مزرعة وتربة واحدة.»</li></ul></li>
<li><p>التدفق الليلي الأدنى لمنطقة ارتفع فجأة من 4 إلى 9 م³/ساعة وبقي، وفي سجل الأحداث ربط مصنع ثلج يعمل ليلًا في اليوم نفسه. ما الخطوة؟</p><ul><li><b>أ.</b> إرسال فريق التسربات فورًا</li><li><b>ب.</b> إيقاف المصنع حتى يُتحقق</li><li><b>ج.</b> تحديث خط الأساس للمنطقة</li><li><b>د.</b> تجاهل المنطقة حتى نهاية الشهر</li></ul></li>
<li><p>فريق صيانة يزور 4 إنذارات في الأسبوع. العتبة A تعطي 6 في الأسبوع باستدعاء 0.9، والعتبة B تعطي 3 باستدعاء 0.7. أيهما تختار؟</p><ul><li><b>أ.</b> A، لأنها ترى أكثر</li><li><b>ب.</b> كلتاهما مرفوضة</li><li><b>ج.</b> B، فهي ضمن طاقة الفريق</li><li><b>د.</b> A، ويزور الفريق ما يستطيع</li></ul></li>
<li><p>صح أم خطأ: رمز المزارع في سجل جهة حكومية ليس بيانات شخصية لأنه ليس اسمًا.</p><ul><li><b>أ.</b> صح</li><li><b>ب.</b> خطأ</li></ul></li>
<li><p>شركة تعرض خريطة حرارية تجارية رخصتها تمنع إعادة النشر، لتستعملها جهة في مخالفات مزارع. ما المشكلة الأهم للحقوق؟</p><ul><li><b>أ.</b> سعرها أعلى بكثير من سعر البيانات المفتوحة</li><li><b>ب.</b> دقة الخريطة الحرارية أخشن من الصور البصرية</li><li><b>ج.</b> الرخصة التجارية نفسها غير نظامية في المملكة</li><li><b>د.</b> المزارع لا يرى الدليل ولا يقدر أن يرد عليه</li></ul></li>
<li><p>حالة استخدام نالت: الماء 3، والجاهزية 3، والإنصاف 2، والمساءلة 0. أين تضعها في الخريطة؟</p><ul><li><b>أ.</b> تُعلَّق حتى يُعاد تصميمها</li><li><b>ب.</b> في أعلى الترتيب بمجموع 8</li><li><b>ج.</b> تُرفض نهائيًّا</li><li><b>د.</b> في وسط الترتيب بعد خصم نقطتين</li></ul></li>
<li><p>مورد يدّعي توفير 5 ملايين م³ في السنة دون أي اختبار في الإقليم. كم درجة الماء بالدليل؟</p><ul><li><b>أ.</b> 3، لأن الرقم فوق 500,000</li><li><b>ب.</b> 2، لأنه تقدير</li><li><b>ج.</b> 0، لأنه غير مختبر</li><li><b>د.</b> 1، عرض مورد لم يُختبر</li></ul></li>
</ol>
